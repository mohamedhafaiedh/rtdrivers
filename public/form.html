<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Netlify Forms Skeleton - RT Drivers</title>
</head>
<body>
  <!-- Formulaire de contact miroir statique -->
  <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input type="hidden" name="bot-field" />
    <input type="hidden" name="subject" value="Nouvelle demande de contact" />
    <input type="text" name="nom" />
    <input type="text" name="prenom" />
    <input type="tel" name="phone" />
    <input type="email" name="email" />
    <textarea name="message"></textarea>
    <input type="hidden" name="pageUrl" />
    <input type="hidden" name="timestamp" />
  </form>

  <!-- Formulaire NetJets miroir statique (Multi-étapes Diamond Services) -->
  <form name="netjets" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="netjets" />
    <input type="hidden" name="bot-field" />
    <input type="hidden" name="subject" value="Nouvelle réservation NetJets" />
    <input type="text" name="depart" />
    <input type="text" name="arrivee" />
    <input type="text" name="passagers" />
    <input type="text" name="prix" />
    <input type="date" name="date" />
    <input type="text" name="heure" />
    <input type="text" name="flightNumber" />
    <input type="text" name="hotelName" />
    <input type="text" name="trainNumber" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <textarea name="message"></textarea>
    <input type="hidden" name="pageUrl" />
    <input type="hidden" name="timestamp" />
  </form>
</body>
</html>
